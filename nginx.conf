# De app en de endpoint op één adres.
#
# Dat ze dezelfde origin delen is geen toeval: dan is /api/review voor de browser gewoon
# een pad in dezelfde app. Geen CORS, geen preflight, geen tweede adres om te onthouden —
# en `tailscale serve` hoeft maar één poort door te zetten.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # de staat van twee gebruikers met jaren historie; ruim genomen
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Het review-servertje ernaast. Een advies kan een halve minuut duren omdat het model
    # nadenkt; met de standaard 60 seconden zou nginx er eerder uit stappen dan de server.
    location /api/ {
        proxy_pass http://api:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # het advies is van vandaag en van dit profiel: nooit uit een tussencache
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # De bundel krijgt een hash in de bestandsnaam, dus die mag lang blijven staan.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # De service worker en het manifest niet: die bepalen wélke bundel er geladen wordt.
    # Een oude service worker uit de browsercache is precies hoe een update blijft hangen.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # één pagina-app: alles wat geen bestand is, is index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
