<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- geen maximum-scale: inzoomen moet kunnen; velden zijn 16px+, dus iOS zoomt zelf al niet -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Twee kleuren voor de statusbalk, zodat hij bij "volg systeem" meteen goed staat.
      De derde, zonder media, is de vangnetwaarde die theme.ts bijwerkt zodra je zelf
      een thema kiest.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131110" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3eee4" />
    <meta name="theme-color" content="#131110" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Trainingsschema</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
